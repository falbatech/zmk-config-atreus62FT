# Power management — go to sleep after 15 minutes idle
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Battery reporting over BLE
CONFIG_ZMK_BATTERY_REPORTING=y

# USB HID enabled, USB logging for diagnostics
CONFIG_ZMK_USB=y
CONFIG_ZMK_HID_INDICATORS=y

# Diagnostic: log kscan events to USB CDC ACM serial
# Disable for production after debugging.
CONFIG_ZMK_USB_LOGGING=y

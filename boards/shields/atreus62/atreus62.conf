# Power management — go to sleep after 15 minutes idle
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Battery reporting over BLE
CONFIG_ZMK_BATTERY_REPORTING=y

# Use the soft-off behavior to truly cut power via the on-board MOSFET
# (uncomment if you wire an external power switch — not needed for stock)
# CONFIG_ZMK_EXT_POWER=y
